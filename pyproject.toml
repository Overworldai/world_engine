[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  # macOS-only: needed to compile we_kernels Metal extension at build time.
  # Harmless no-ops on Linux/Windows (cmake/nanobind install but aren't used).
  "cmake>=3.27",
  "nanobind==2.10.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "world_engine"
version = "1.5.0"
requires-python = ">=3.10"
dependencies = [
  "taehv @ https://github.com/madebyollin/taehv/archive/7dc60ec6601af2e668e31bc70acc4cb3665e4c22.zip",
  "torch==2.10.0",
  "fbgemm-gpu-genai==1.5.0; sys_platform == 'linux'",
  "einops",
  "tensordict==0.10.0",
  "transformers>=5.3.0",
  "ftfy",
  "diffusers",
  "huggingface-hub>=1.7.0",
  "omegaconf",
  "accelerate==1.12.0",
  # Triton (platform-specific)
  "triton==3.6.0; sys_platform == 'linux'",
  "triton-windows==3.6.0.post26; sys_platform == 'win32'",
  "gemlite @ https://github.com/dropbox/gemlite/archive/ebfcc197d694acd4ca8dfaadf5fceb3570401df3.zip",
  # MLX / Metal (macOS only)
  "mlx; sys_platform == 'darwin'",
  "matplotlib>=3.10.8",
]

[tool.uv.sources]
mlx = { git = "https://github.com/Clydingus/mlx.git", branch = "fix/sdpa-nax-int16-overflow" }

[tool.uv]
no-build-isolation-package = ["world-engine"]

[tool.setuptools]
packages = [
  "world_engine",
  "world_engine.model",
  "world_engine.mlx_metal",
  "world_engine.mlx_metal.ane",
  "we_kernels",
]

[tool.setuptools.package-dir]
world_engine = "src"
we_kernels = "src/mlx_metal/ext/we_kernels"

[dependency-groups]
dev = [
  "pytest",
  "pytest-benchmark",
  "opencv-python",
  "imageio[pyav]",
  "numpy",
]
